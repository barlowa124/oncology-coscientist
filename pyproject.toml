[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncocs"
version = "0.1.0"
description = "Cohort-agnostic survival-analysis pipeline on public TCGA data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "lifelines>=0.27",
    "scikit-survival>=0.24",
    "scikit-learn>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
oncocs = "oncocs.cli:main"

[tool.setuptools.packages.find]
include = ["oncocs*"]
